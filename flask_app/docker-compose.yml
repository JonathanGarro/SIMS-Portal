services:
  web:
    build: .
    volumes:
      - ./SIMS_Portal:/app/SIMS_Portal
      - ./db:/app/db
      - ./migrations:/app/migrations
      # SIMS_Portal/static/assets is a symlink to ../../assets/ (this folder's
      # assets/), which is how the images reach the production image too. Mount it
      # live so local image changes show up without a rebuild.
      - ./assets:/app/assets
    ports:
      - "5001:5000"
    env_file: ./.env
    environment:
      - FLASK_DEBUG=1
    # the image's own CMD runs gunicorn (production-safe default); override back
    # to flask run here for local dev's auto-reload on code changes
    command: flask run --host=0.0.0.0 --port=5000