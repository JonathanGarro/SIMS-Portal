# Ruff is enforced in CI: syntax errors (E9) plus all of pyflakes (F) - undefined
# names, unused imports and variables, redefinitions, etc. Formatting/style rules
# are not enforced yet.
target-version = "py311"
extend-exclude = ["migrations"]

[lint]
select = ["E9", "F"]

[format]
# not enforced yet; the codebase mixes tabs and spaces
indent-style = "tab"
