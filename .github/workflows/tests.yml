name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flask_app

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sims
          POSTGRES_PASSWORD: sims
          POSTGRES_DB: sims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sims -d sims_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://sims:sims@localhost:5432/sims_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            flask_app/requirements.txt
            flask_app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check SIMS_Portal tests

      - name: Run tests
        run: pytest
